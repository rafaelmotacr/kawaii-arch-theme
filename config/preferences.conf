# =====================================================================
#  Kawaii Arch Theme - preferencias
#
#  Instalado em /var/lib/kawaii-arch-manager/config/preferences.conf.
#  Edite e aplique sem reinstalar:
#      sudo kawaii-arch-manager --reload-confs     (--dry-run: so mostra)
#  Os comandos do manager (--set-mode, --logo, ...) e o install.sh tambem
#  gravam aqui; eles trocam so o valor da linha e mantem os comentarios.
#
#  Formato: CHAVE="valor" (sem espacos em volta do =). Lido como texto,
#  nunca executado. Chave ausente = valor padrao indicado abaixo.
# =====================================================================

# --- Wallpaper --------------------------------------------------------
# MODE: como o wallpaper e escolhido a cada troca (boot ou --randomize)
#   fixed     sempre SELECTED_BACKGROUND
#   set       aleatorio entre as imagens de SELECTED_BUNDLE
#   global    aleatorio entre todas as imagens de todos os bundles (padrao)
#   balanced  primeiro um bundle aleatorio, depois uma imagem dele
MODE="global"

# SELECTED_BUNDLE: ID do bundle usado no modo set
# (kawaii-arch-manager --list-bundles)
SELECTED_BUNDLE=""

# SELECTED_BACKGROUND: ID/arquivo.png usado no modo fixed
SELECTED_BACKGROUND=""

# --- Visual do tema (aplicado no theme.txt) ---------------------------
# LOGO: on | off - logo da distribuicao abaixo do menu (padrao: on)
LOGO="on"

# MENU_BOX: on | off - contorno de vidro em volta do menu de boot
# (padrao: on). As entradas do menu ficam no mesmo lugar nos dois casos.
MENU_BOX="on"

# TONE: auto | dark | light - cores de texto, icones, bordas e logo
#   auto   medido pela claridade de cada wallpaper aplicado (padrao)
#   dark   sempre o tom para wallpaper escuro (texto e icones claros)
#   light  sempre o tom para wallpaper claro (texto e icones escuros)
TONE="auto"

# --- Instalacao limpa (install.sh --fresh) ----------------------------
# ON_FRESH_INSTALL: o que acontece com bundles e preferencias
# (/var/lib/kawaii-arch-manager) numa instalacao limpa. O tema em /boot e
# sempre apagado e reinstalado, sem backup.
#   backup    move bundles/ e config/ para bundles.old/ e config.old/ e
#             reinstala com os padroes (padrao). Um novo backup substitui
#             o anterior. Para recuperar um bundle:
#             sudo kawaii-arch-manager --import-bundle .../bundles.old/<id>
#   override  apaga bundles, preferencias e estado (os .old existentes ficam)
#   keep      nao altera bundles, preferencias, estado nem o wallpaper ativo
ON_FRESH_INSTALL="backup"
